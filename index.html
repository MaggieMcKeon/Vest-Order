<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The North Face Iron Drift Quilted Vest: Team Order</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:      #111110;
      --canvas:   #f7f6f4;
      --white:    #ffffff;
      --mid:      #e4e2de;
      --warm:     #c4bfb5;
      --green:    #2d5a27;
      --green-lt: #3d7a36;
      --danger:   #b91c1c;
      --soft:     #6b6760;
      --radius:   8px;
    }
    body { background: var(--canvas); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }

    header {
      background: var(--ink); color: var(--white);
      padding: 0 40px; display: flex; align-items: center;
      justify-content: space-between; min-height: 54px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
    .hdiv { width: 1px; height: 22px; background: #333; }
    .header-sub { font-size: 0.8rem; color: #aaa; }
    .header-tag {
      font-family: 'DM Mono', monospace; font-size: 0.6rem;
      background: var(--green); padding: 3px 8px; border-radius: 3px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    .page {
      max-width: 900px; margin: 0 auto; padding: 40px 24px 80px;
      display: grid; grid-template-columns: 380px 1fr; gap: 36px; align-items: start;
    }
    @media (max-width: 740px) {
      .page { grid-template-columns: 1fr; padding: 24px 16px 60px; }
      header { padding: 0 16px; }
    }

    .jacket-panel { position: sticky; top: 24px; }
    .jacket-img-wrap {
      border-radius: var(--radius); overflow: hidden; background: #ffffff; border: 1px solid var(--mid);
      aspect-ratio: 3/5; max-height: 74vh; width: 100%; display: flex; align-items: center; justify-content: center; position: relative;
    }
    .jacket-img-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: center center; display: block; }
    .jacket-badge {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(0,0,0,0.72); color: #fff; font-size: 0.72rem;
      padding: 5px 10px; border-radius: 4px; backdrop-filter: blur(4px);
      display: flex; align-items: center; gap: 6px;
    }
    .jacket-badge .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #1a1a18; border: 1.5px solid #555; flex-shrink: 0;
    }
    .jacket-specs {
      margin-top: 14px; background: var(--white); border: 1px solid var(--mid);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .spec-row {
      display: flex; justify-content: space-between; font-size: 0.78rem;
      padding: 5px 0; border-bottom: 1px solid var(--mid);
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { color: var(--soft); }
    .spec-val { font-weight: 500; text-align: right; }
    .spec-val.green { color: var(--green); }

    .form-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
    .form-desc { font-size: 0.85rem; color: var(--soft); margin-bottom: 24px; line-height: 1.5; }

    .form-card { background: var(--white); border: 1px solid var(--mid); border-radius: var(--radius); overflow: hidden; }
    .form-section { padding: 22px 24px; border-bottom: 1px solid var(--mid); }
    .form-section:last-child { border-bottom: none; }

    .section-label {
      font-family: 'DM Mono', monospace; font-size: 0.62rem;
      letter-spacing: 0.13em; text-transform: uppercase; color: var(--green); margin-bottom: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.8rem; font-weight: 500; }
    .field label .req { color: var(--green); margin-left: 2px; }
    .field input, .field textarea {
      background: var(--canvas); border: 1px solid var(--warm); border-radius: 6px;
      padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 0.88rem;
      color: var(--ink); outline: none; transition: border-color 0.15s, background 0.15s; width: 100%;
    }
    .field input:focus, .field textarea:focus { border-color: var(--green); background: var(--white); }
    .field input.err { border-color: var(--danger); }
    .field .err-msg { font-size: 0.72rem; color: var(--danger); }
    .field textarea { resize: vertical; min-height: 64px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fields-stack { display: flex; flex-direction: column; gap: 12px; }

    .gender-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gender-card {
      border: 2px solid var(--mid); border-radius: var(--radius); padding: 16px 12px 14px;
      cursor: pointer; text-align: center; transition: border-color 0.15s, background 0.15s;
      background: var(--canvas); position: relative;
    }
    .gender-card:hover { border-color: var(--warm); }
    .gender-card.selected { border-color: var(--ink); background: var(--white); }
    .gender-card .gcheck {
      position: absolute; top: 10px; right: 10px; width: 17px; height: 17px;
      border-radius: 50%; border: 2px solid var(--warm); background: var(--white);
      display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s;
    }
    .gender-card.selected .gcheck { border-color: var(--ink); background: var(--ink); }
    .gender-card.selected .gcheck::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--white); }
    .gender-card svg { display: block; margin: 0 auto 8px; }
    .gender-card .gname { font-size: 0.88rem; font-weight: 600; }
    .gender-card .gsub { font-size: 0.7rem; color: var(--soft); margin-top: 2px; }

    .size-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .size-pill {
      border: 1px solid var(--warm); border-radius: 5px; padding: 8px 17px;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; background: var(--canvas);
      color: var(--ink); font-family: 'DM Mono', monospace;
      transition: background 0.12s, border-color 0.12s, color 0.12s; letter-spacing: 0.04em;
    }
    .size-pill:hover { border-color: #888; }
    .size-pill.selected { background: var(--ink); color: var(--white); border-color: var(--ink); }

    .size-table { margin-top: 14px; border: 1px solid var(--mid); border-radius: 6px; overflow: hidden; font-size: 0.75rem; }
    .size-table table { width: 100%; border-collapse: collapse; }
    .size-table th {
      background: var(--mid); padding: 6px 10px; text-align: left;
      font-size: 0.66rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    }
    .size-table td { padding: 6px 10px; border-top: 1px solid var(--mid); color: var(--soft); font-family: 'DM Mono', monospace; }
    .size-table tr.active td { background: #f0f0ec; color: var(--ink); font-weight: 600; }
    .size-table tbody tr:hover td { background: #f5f5f2; cursor: pointer; }

    .prompt-box {
      background: var(--canvas); border: 1px solid var(--mid); border-radius: 6px;
      padding: 12px 14px; font-size: 0.8rem; color: var(--soft); display: flex; align-items: center; gap: 8px;
    }

    .submit-btn {
      width: 100%; padding: 13px; background: var(--green); color: #fff; border: none;
      border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; margin-top: 20px; letter-spacing: 0.01em;
    }
    .submit-btn:hover:not(:disabled) { background: var(--green-lt); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Submitting spinner ── */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success ── */
    .success-page { max-width: 520px; margin: 72px auto; text-align: center; padding: 0 24px; }
    .success-page .s-icon { font-size: 3rem; margin-bottom: 18px; }
    .success-page h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    .success-page p { color: var(--soft); line-height: 1.65; font-size: 0.9rem; margin-bottom: 24px; }
    .order-ref {
      font-family: 'DM Mono', monospace; font-size: 0.74rem; background: var(--mid);
      display: inline-block; padding: 8px 20px; border-radius: 5px;
      letter-spacing: 0.1em; color: var(--green); margin-bottom: 24px;
    }
    .success-card {
      background: var(--white); border: 1px solid var(--mid); border-radius: var(--radius);
      padding: 18px 20px; text-align: left; margin-bottom: 24px;
    }
    .success-card .sc-row {
      display: flex; justify-content: space-between; font-size: 0.82rem;
      padding: 5px 0; border-bottom: 1px solid var(--mid);
    }
    .success-card .sc-row:last-child { border-bottom: none; }
    .success-card .sc-key { color: var(--soft); }
    .success-card .sc-val { font-weight: 600; }
    .new-order-btn {
      padding: 11px 26px; background: var(--ink); color: var(--white); border: none;
      border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer;
    }

    /* ── Setup banner (shown until Apps Script URL is configured) ── */
    .setup-banner {
      background: #fffbe6; border: 1px solid #f0d060; border-radius: 6px;
      padding: 12px 16px; font-size: 0.8rem; color: #6b5a00; margin-bottom: 20px; line-height: 1.5;
    }
    .setup-banner strong { color: #3a3000; }
  </style>
</head>

    function ManIcon({ color = '#c4bfb5' }) {
      return (
        <svg width="48" height="60" viewBox="0 0 48 60" fill="none">
          <circle cx="24" cy="9" r="7" fill={color}/>
          <path d="M10 26c0-7.7 6.3-14 14-14s14 6.3 14 14v18H10V26z" fill={color}/>
          <path d="M10 44v14M38 44v14" stroke={color} strokeWidth="5" strokeLinecap="round"/>
          <path d="M4 30h40" stroke={color} strokeWidth="3.5" strokeLinecap="round" opacity="0.4"/>
        </svg>
      );
    }
    function WomanIcon({ color = '#c4bfb5' }) {
      return (
        <svg width="48" height="60" viewBox="0 0 48 60" fill="none">
          <circle cx="24" cy="9" r="7" fill={color}/>
          <path d="M10 28c0-7.7 6.3-14 14-14s14 6.3 14 14l3 14H7l3-14z" fill={color}/>
          <path d="M14 42v16M34 42v16" stroke={color} strokeWidth="5" strokeLinecap="round"/>
        </svg>
      );
    }

    function validate(form) {
      const e = {};
      if (!form.firstName.trim()) e.firstName = 'Required';
      if (!form.lastName.trim())  e.lastName  = 'Required';
      if (!form.email.trim() || !/\S+@\S+\.\S+/.test(form.email)) e.email = 'Valid email required';
      if (!form.gender)  e.gender = "Please select Men's or Women's";
      if (!form.size)    e.size   = 'Please select a size';
      return e;
    }

    function App() {
      const [form, setForm]       = useState({ firstName:'', lastName:'', email:'', gender:'', size:'', notes:'' });
      const [errors, setErrors]   = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [submitted, setSubmitted]   = useState(false);
      const [submitError, setSubmitError] = useState('');
      const [orderRef, setOrderRef] = useState('');
      const [imgError, setImgError] = useState(false);

      const set    = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const clrErr = (...ks) => setErrors(e => { const n={...e}; ks.forEach(k=>delete n[k]); return n; });

      const sizes  = form.gender === 'mens' ? MENS_SIZES : form.gender === 'womens' ? WOMENS_SIZES : [];
      const imgSrc = imgError ? null : (JACKET_IMGS[form.gender] || JACKET_IMGS.default);

      const f = (key) => ({
        value: form[key],
        onChange: e => { set(key, e.target.value); clrErr(key); },
        className: errors[key] ? 'err' : '',
      });

      async function handleSubmit() {
        const errs = validate(form);
        setErrors(errs);
        if (Object.keys(errs).length > 0) {
          const el = document.querySelector('.err, [data-err="true"]');
          if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
          return;
        }

        const ref = 'TNF-' + Date.now().toString(36).toUpperCase().slice(-6);
        setOrderRef(ref);

        if (!CONFIGURED) {
          // Not yet wired up — just show success locally
          setSubmitted(true);
          window.scrollTo({ top:0, behavior:'smooth' });
          return;
        }

        setSubmitting(true);
        setSubmitError('');

        try {
          const payload = {
            product:   'TNF Iron Drift Quilted Vest',
            orderRef: ref,
            timestamp: new Date().toISOString(),
            firstName: form.firstName,
            lastName:  form.lastName,
            email:     form.email,
            style:     form.gender === 'mens' ? "Men's" : "Women's",
            size:      form.size,
            color:     'Black',
            notes:     form.notes || '',
          };

          await fetch(FORMSPREE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload),
          });

          setSubmitted(true);
          window.scrollTo({ top:0, behavior:'smooth' });
        } catch (err) {
          setSubmitError('Something went wrong. Please try again or contact Maggie directly.');
        } finally {
          setSubmitting(false);
        }
      }

      if (submitted) {
        return (
          <>
            <header>
              <div className="header-left">
                <div className="logo" style={{textTransform:"uppercase",letterSpacing:"0.04em",fontSize:"1.05rem"}}>The North Face</div>
                <div className="hdiv"/>
                <div className="header-sub">Iron Drift Quilted Vest · Team Order</div>
              </div>
              <div className="header-tag">Internal Use Only</div>
            </header>
            <div className="success-page">
              <div className="s-icon">🧥</div>
              <h2>You're on the list!</h2>
              <p>
                Got it, <strong>{form.firstName}</strong>! Your selection has been recorded and will be included in the group order. Keep an eye on your email for updates.
              </p>
              <div className="order-ref">{orderRef}</div>
              <div className="success-card">
                <div className="sc-row"><span className="sc-key">Name</span><span className="sc-val">{form.firstName} {form.lastName}</span></div>
                <div className="sc-row"><span className="sc-key">Email</span><span className="sc-val">{form.email}</span></div>
                <div className="sc-row"><span className="sc-key">Style</span><span className="sc-val">{form.gender === 'mens' ? "Men's" : "Women's"} · Black</span></div>
                <div className="sc-row"><span className="sc-key">Size</span><span className="sc-val">{form.size}</span></div>
                {form.notes && <div className="sc-row"><span className="sc-key">Notes</span><span className="sc-val">{form.notes}</span></div>}
              </div>
              <button className="new-order-btn" onClick={() => {
                setForm({ firstName:'',lastName:'',email:'',gender:'',size:'',notes:'' });
                setErrors({}); setSubmitted(false); setSubmitError('');
              }}>Submit another</button>
            </div>
          </>
        );
      }

      return (
        <>
          <header>
            <div className="header-left">
              <div className="logo" style={{textTransform:"uppercase",letterSpacing:"0.04em",fontSize:"1.05rem"}}>The North Face</div>
              <div className="hdiv"/>
              <div className="header-sub">Iron Drift Quilted Vest · Team Order</div>
            </div>
            <div className="header-tag">Internal Use Only</div>
          </header>

          <div className="page">

            {/* ── Left: photo + specs ── */}
            <div className="jacket-panel">
              <div className="jacket-img-wrap">
                {imgSrc ? (
                  <img
                    src={imgSrc}
                    alt={`The North Face Iron Drift Quilted Vest, ${form.gender === 'womens' ? "Women's" : "Men's"} Black`}
                    onError={() => setImgError(true)}
                  />
                ) : (
                  <svg width="160" height="200" viewBox="0 0 160 200" fill="none">
                    <path d="M30 55l30-25 12 18 8-6 8 6 12-18 30 25v130H30V55z" fill="#2e2e2c"/>
                    <path d="M68 48l12 16 12-16" stroke="#4a4a46" strokeWidth="3"/>
                    <path d="M80 64v96" stroke="#3a3a36" strokeWidth="2"/>
                    <rect x="56" y="96" width="14" height="16" rx="2" fill="#3a3a36"/>
                  </svg>
                )}
                <div className="jacket-badge">
                  <div className="dot"/>
                  Black · {form.gender === 'womens' ? "Women's" : "Men's"}
                </div>
              </div>
              <div className="jacket-specs">
                <div className="spec-row"><span className="spec-key">Product</span><span className="spec-val">Iron Drift Quilted Vest</span></div>
                <div className="spec-row"><span className="spec-key">Color</span><span className="spec-val">Black</span></div>
                <div className="spec-row"><span className="spec-key">Material</span><span className="spec-val">100% recycled nylon ripstop</span></div>
                <div className="spec-row"><span className="spec-key">Decoration</span><span className="spec-val">1-location embroidery</span></div>
                <div className="spec-row"><span className="spec-key">Features</span><span className="spec-val">Water repellent, lightweight</span></div>
              </div>
            </div>

            {/* ── Right: Form ── */}
            <div className="form-panel">
              <div className="form-title">Claim your vest</div>
              <div className="form-desc">
                Product &amp; Engineering team only. Fill out your details so we can include you in the group order. One vest per person.
              </div>


              <div className="form-card">

                {/* Your Info */}
                <div className="form-section">
                  <div className="section-label">Your Info</div>
                  <div className="fields-stack">
                    <div className="row-2">
                      <div className="field">
                        <label>First name <span className="req">*</span></label>
                        <input placeholder="Alex" {...f('firstName')} />
                        {errors.firstName && <div className="err-msg">{errors.firstName}</div>}
                      </div>
                      <div className="field">
                        <label>Last name <span className="req">*</span></label>
                        <input placeholder="Murphy" {...f('lastName')} />
                        {errors.lastName && <div className="err-msg">{errors.lastName}</div>}
                      </div>
                    </div>
                    <div className="field">
                      <label>Work email <span className="req">*</span></label>
                      <input type="email" placeholder="alex@freshworks.com" {...f('email')} />
                      {errors.email && <div className="err-msg">{errors.email}</div>}
                    </div>
                  </div>
                </div>

                {/* Style */}
                <div className="form-section">
                  <div className="section-label">Style</div>
                  <div className="gender-cards" data-err={!!errors.gender}>
                    {[
                      { id:'mens',   label:"Men's",   sub:'Sizes S to 3XL',  Icon: ManIcon },
                      { id:'womens', label:"Women's",  sub:'Sizes S to 2XL', Icon: WomanIcon },
                    ].map(({ id, label, sub, Icon }) => (
                      <div
                        key={id}
                        className={`gender-card${form.gender === id ? ' selected' : ''}`}
                        onClick={() => { set('gender', id); set('size',''); clrErr('gender','size'); }}
                      >
                        <div className="gcheck"/>
                        <Icon color={form.gender === id ? '#1a1a18' : '#c4bfb5'} />
                        <div className="gname">{label}</div>
                        <div className="gsub">{sub}</div>
                      </div>
                    ))}
                  </div>
                  {errors.gender && <div className="field" style={{marginTop:8}}><div className="err-msg">{errors.gender}</div></div>}
                </div>

                {/* Size */}
                <div className="form-section">
                  <div className="section-label">Size</div>
                  {!form.gender ? (
                    <div className="prompt-box"><span>↑</span> Select Men's or Women's above to see sizes.</div>
                  ) : (
                    <>
                      <div className="size-row">
                        {sizes.map(s => (
                          <div key={s} className={`size-pill${form.size === s ? ' selected' : ''}`}
                            onClick={() => { set('size', s); clrErr('size'); }}>{s}</div>
                        ))}
                      </div>
                      {errors.size && <div className="field" style={{marginTop:6}}><div className="err-msg">{errors.size}</div></div>}
                      <div className="size-table">
                        <table>
                          <thead>
                            <tr>
                              <th>Size</th>
                              {form.gender === 'womens' && <th>Fits</th>}
                              <th>Body length</th>
                              <th>{form.gender === 'womens' ? 'Bust' : 'Chest'}</th>
                            </tr>
                          </thead>
                          <tbody>
                            {SIZE_GUIDE[form.gender].map(r => (
                              <tr key={r.size} className={form.size === r.size ? 'active' : ''}
                                onClick={() => { set('size', r.size); clrErr('size'); }}>
                                <td>{r.size}</td>
                                {form.gender === 'womens' && <td>{r.fits}</td>}
                                <td>{r.length}</td>
                                <td>{form.gender === 'womens' ? r.bust : r.chest}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      <div style={{fontSize:'0.7rem',color:'var(--soft)',marginTop:6,lineHeight:1.5}}>
                        Click a row or a size to select. Product measurements in inches. Body length is measured from the high point of the shoulder to the finished hem at the back.{form.gender === 'mens' ? ' Chest is measured across the chest one inch below the armhole when laid flat.' : ''}
                      </div>
                    </>
                  )}
                </div>

                {/* Notes */}
                <div className="form-section">
                  <div className="section-label">Notes (optional)</div>
                  <div className="field">
                    <textarea placeholder="Fit preferences or anything else we should know…" {...f('notes')} />
                  </div>
                </div>

              </div>

              {submitError && (
                <div style={{marginTop:12,fontSize:'0.82rem',color:'var(--danger)',textAlign:'center'}}>{submitError}</div>
              )}

              <button className="submit-btn" onClick={handleSubmit} disabled={submitting}>
                {submitting ? <><span className="spinner"/>Submitting…</> : 'Submit My Order →'}
              </button>

            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
